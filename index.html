<!DOCTYPE html>
<html lang="en" id="htmlTag">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YearnaZ — Find it. Return it. Fast.</title>
  <meta name="description" content="Reunite with lost items across airports, transit, hotels, and campuses.">
  <link href="https://fonts.googleapis.com/css2?family=ClashGrotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdfcff;
      --text: #1a1a2e;
      --card-bg: white;
      --primary: #4facfe;
      --accent: #ff6b6b;
      --border: #f0f4ff;
    }
    [data-theme="dark"] {
      --bg: #0d0d1a;
      --text: #f0f4ff;
      --card-bg: #161625;
      --border: #25253a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'ClashGrotesk', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background 0.3s;
    }
    .container { width: 90%; max-width: 800px; margin: 0 auto; padding: 20px; }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .logo { 
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo svg { width: 28px; height: 28px; }
    .controls { display: flex; gap: 12px; }
    select, button {
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .hero { text-align: center; padding: 50px 0; }
    h1 { font-size: 2.5rem; margin-bottom: 16px; line-height: 1.2; }
    .subtitle { opacity: 0.85; margin-bottom: 30px; max-width: 600px; margin: 0 auto; }
    .search-box {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 20px;
      margin: 30px auto;
      max-width: 520px;
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.15);
    }
    input, .search-btn {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: 2px solid var(--border);
      border-radius: 16px;
      font-size: 1.1rem;
      font-family: 'ClashGrotesk', sans-serif;
    }
    input {
      background: var(--card-bg);
      color: var(--text);
    }
    .search-btn {
      background: linear-gradient(135deg, var(--primary), #4361ee);
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(79, 172, 254, 0.3);
    }
    #results { margin-top: 20px; text-align: left; }
    .result-item {
      padding: 14px;
      margin: 10px 0;
      background: rgba(79, 172, 254, 0.05);
      border-radius: 12px;
      border-left: 4px solid var(--primary);
    }
    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 400px;
      margin: 30px auto 0;
    }
    .btn {
      padding: 18px;
      border-radius: 18px;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.3);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4361ee);
      color: white;
    }
    .btn-secondary {
      background: linear-gradient(135deg, var(--accent), #ff5252);
      color: white;
    }
    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(79, 172, 254, 0.4);
    }
    .proof {
      text-align: center;
      opacity: 0.85;
      font-size: 0.95rem;
      margin-top: 20px;
    }
    footer {
      text-align: center;
      padding: 30px 0;
      opacity: 0.8;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
      margin: 0 10px;
    }
    @media (min-width: 768px) {
      .cta-group { flex-direction: row; }
      .btn { max-width: 220px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div class="logo">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6e8efb" />
              <stop offset="100%" stop-color="#a777e3" />
            </linearGradient>
          </defs>
          <path d="M16 6 C22 6 26 10 26 16 C26 22 22 26 16 26 C10 26 6 22 6 16 C6 12 8 8 12 6" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
          <path d="M20 22 L24 18 L20 14" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        YearnaZ
      </div>
      <div class="controls">
        <select id="langSelect">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="nl">Nederlands</option>
          <option value="ru">Русский</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
          <option value="ar">العربية</option>
        </select>
        <button id="themeBtn">🌙</button>
      </div>
    </nav>

    <main>
      <section class="hero">
        <h1 id="heroTitle">YearnaZ — Find it. Return it. Fast.</h1>
        <p class="subtitle" id="heroSubtitle">Lost on the go? Reconnect with your things.</p>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="e.g., Black wallet, Silver AirPods">
          <button class="search-btn" id="searchBtn">🔍 Search Lost Items</button>
          <div id="results"></div>
        </div>

        <div class="cta-group">
          <a href="report-lost.html" class="btn btn-primary" id="cta1">🔍 Find My Thing</a>
          <a href="report-found.html" class="btn btn-secondary" id="cta2">❤️ I Found Something</a>
        </div>

        <p class="proof">“Found my passport at JFK in 8 mins!” — Maya, 22</p>
      </section>
    </main>

    <footer>
      <p>© 2025 YearnaZ. Kindness, powered by community.</p>
      <p>
        <a href="about.html">About</a> • 
        <a href="privacy.html">Privacy</a> • 
        <a href="contact.html">Contact</a> • 
        <a href="hero-wall.html">Hero Wall</a>
      </p>
    </footer>
  </div>

  <!-- CRISP CHAT -->
  <script type="text/javascript">
    window.$crisp = []; window.CRISP_WEBSITE_ID = "YOUR_CRISP_ID";
    (function() { d = document; s = d.createElement("script");
    s.src = "https://client.crisp.chat/l.js"; s.async = 1;
    d.getElementsByTagName("head")[0].appendChild(s); })();
  </script>

  <script type="module">
    // Theme Toggle
    const themeBtn = document.getElementById('themeBtn');
    const isDark = localStorage.getItem('theme') === 'dark';
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });

    // Multilingual Support
    const translations = {
      en: { 
        heroTitle: "YearnaZ — Find it. Return it. Fast.", 
        heroSubtitle: "Lost on the go? Reconnect with your things.",
        searchPlaceholder: "e.g., Black wallet, Silver AirPods",
        searchBtn: "🔍 Search Lost Items",
        cta1: "🔍 Find My Thing",
        cta2: "❤️ I Found Something"
      },
      es: { 
        heroTitle: "YearnaZ — Encuéntralo. Devuélvelo. Rápido.", 
        heroSubtitle: "¿Perdiste algo? Reconéctate con tus pertenencias.",
        searchPlaceholder: "ej. Billetera negra, AirPods plateados",
        searchBtn: "🔍 Buscar Objetos Perdidos",
        cta1: "🔍 Encuentra Mi Cosa",
        cta2: "❤️ Encontré Algo"
      },
      fr: { 
        heroTitle: "YearnaZ — Trouvez-le. Rendez-le. Rapidement.", 
        heroSubtitle: "Perdu en déplacement ? Retrouvez vos affaires.",
        searchPlaceholder: "ex. Portefeuille noir, AirPods argentés",
        searchBtn: "🔍 Rechercher des objets perdus",
        cta1: "🔍 Trouve Mon Truc",
        cta2: "❤️ J’ai Trouvé Quelque Chose"
      },
      de: { 
        heroTitle: "YearnaZ — Finde es. Gib es zurück. Schnell.", 
        heroSubtitle: "Unterwegs verloren? Verbinde dich wieder mit deinen Dingen.",
        searchPlaceholder: "z. B. Schwarze Brieftasche, Silberne AirPods",
        searchBtn: "🔍 Verlorene Gegenstände suchen",
        cta1: "🔍 Finde Mein Ding",
        cta2: "❤️ Ich Habe Etwas Gefunden"
      },
      pt: { 
        heroTitle: "YearnaZ — Encontre. Devolva. Rápido.", 
        heroSubtitle: "Perdeu algo? Reconecte-se com seus pertences.",
        searchPlaceholder: "ex. Carteira preta, AirPods prateados",
        searchBtn: "🔍 Buscar Itens Perdidos",
        cta1: "🔍 Encontre Minha Coisa",
        cta2: "❤️ Encontrei Algo"
      },
      it: { 
        heroTitle: "YearnaZ — Trovalo. Restituiscilo. Veloce.", 
        heroSubtitle: "Perso qualcosa? Riconnettiti con i tuoi oggetti.",
        searchPlaceholder: "es. Portafoglio nero, AirPods argentati",
        searchBtn: "🔍 Cerca Oggetti Smarriti",
        cta1: "🔍 Trova La Mia Cosa",
        cta2: "❤️ Ho Trovato Qualcosa"
      },
      nl: { 
        heroTitle: "YearnaZ — Vind het. Geef het terug. Snel.", 
        heroSubtitle: "Onderweg iets verloren? Herstel de verbinding met je spullen.",
        searchPlaceholder: "bijv. Zwarte portemonnee, Zilveren AirPods",
        searchBtn: "🔍 Zoek Verloren Voorwerpen",
        cta1: "🔍 Vind Mijn Spul",
        cta2: "❤️ Ik Heb Iets Gevonden"
      },
      ru: { 
        heroTitle: "YearnaZ — Найди. Верни. Быстро.", 
        heroSubtitle: "Потеряли что-то в пути? Верните связь с вещами.",
        searchPlaceholder: "напр., Черный кошелек, Серебряные AirPods",
        searchBtn: "🔍 Поиск потерянных вещей",
        cta1: "🔍 Найди Мою Вещь",
        cta2: "❤️ Я Нашел Что-то"
      },
      ja: { 
        heroTitle: "YearnaZ — 見つけて。返して。素早く。", 
        heroSubtitle: "移動中に紛失？物を再接続。",
        searchPlaceholder: "例: 黒い財布、シルバーのAirPods",
        searchBtn: "🔍 紛失物を検索",
        cta1: "🔍 私の物を探して",
        cta2: "❤️ 見つけました"
      },
      ko: { 
        heroTitle: "YearnaZ — 찾고. 돌려주고. 빠르게.", 
        heroSubtitle: "이동 중 분실? 물건을 다시 연결하세요.",
        searchPlaceholder: "예: 검정 지갑, 실버 에어팟",
        searchBtn: "🔍 분실물 검색",
        cta1: "🔍 내 물건 찾기",
        cta2: "❤️ 무언가를 찾았어요"
      },
      zh: { 
        heroTitle: "YearnaZ — 找到它。归还它。快速。", 
        heroSubtitle: "途中丢失？重新连接您的物品。",
        searchPlaceholder: "例如：黑色钱包，银色AirPods",
        searchBtn: "🔍 搜索丢失物品",
        cta1: "🔍 找回我的东西",
        cta2: "❤️ 我捡到了东西"
      },
      ar: { 
        heroTitle: "YearnaZ — اعثر عليه. أعدْه. بسرعة.", 
        heroSubtitle: "هل فقدت شيئًا أثناء التنقّل؟ أعد الاتصال بأشيائك.",
        searchPlaceholder: "مثل: محفظة سوداء، AirPods فضية",
        searchBtn: "🔍 البحث عن أشياء مفقودة",
        cta1: "🔍 اعثر على شي",
        cta2: "❤️ وجدت شيئًا"
      }
    };

    function updateLang(lang) {
      const t = translations[lang] || translations.en;
      document.getElementById('heroTitle').textContent = t.heroTitle;
      document.getElementById('heroSubtitle').textContent = t.heroSubtitle;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('searchBtn').textContent = t.searchBtn;
      document.getElementById('cta1').innerHTML = t.cta1;
      document.getElementById('cta2').innerHTML = t.cta2;
      localStorage.setItem('lang', lang);
    }

    const savedLang = localStorage.getItem('lang') || navigator.language.split('-')[0] || 'en';
    const lang = translations[savedLang] ? savedLang : 'en';
    updateLang(lang);
    document.getElementById('langSelect').value = lang;
    document.getElementById('langSelect').addEventListener('change', e => updateLang(e.target.value));

    // Supabase Search
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

    document.getElementById('searchBtn').addEventListener('click', async () => {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const { data, error } = await supabase
        .from('reports')
        .select('item_name, location, description, type')
        .or(`item_name.ilike.%${query}%,description.ilike.%${query}%`)
        .limit(5);

      const resultsDiv = document.getElementById('results');
      if (error) {
        resultsDiv.innerHTML = `<p style="color:var(--accent);">❌ Error: ${error.message}</p>`;
        return;
      }

      if (data.length === 0) {
        resultsDiv.innerHTML = '<p>No matches found. Be the first to report!</p>';
        return;
      }

      resultsDiv.innerHTML = data.map(item => 
        `<div class="result-item">
          <strong>${item.item_name}</strong> <em>(${item.type})</em><br>
          ${item.description}<br>
          <small>📍 ${item.location}</small>
        </div>`
      ).join('');
    });
  </script>
</body>
</html>
