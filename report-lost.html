<!DOCTYPE html>
<html lang="en" id="htmlTag">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Report a Lost Item - YearnaZ</title>
  <link href="https://fonts.googleapis.com/css2?family=ClashGrotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdfcff;
      --text: #1a1a2e;
      --card-bg: white;
      --primary: #4facfe;
      --accent: #ff6b6b;
      --border: #f0f4ff;
    }
    [data-theme="dark"] {
      --bg: #0d0d1a;
      --text: #f0f4ff;
      --card-bg: #161625;
      --border: #25253a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'ClashGrotesk', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background 0.3s;
    }
    .container { width: 90%; max-width: 800px; margin: 0 auto; padding: 20px; }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .logo { 
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo svg { width: 28px; height: 28px; }
    .controls { display: flex; gap: 12px; }
    select, button {
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .form-box {
      background: var(--card-bg);
      padding: 36px;
      border-radius: 24px;
      margin: 40px auto;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(79, 172, 254, 0.15);
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .subtitle {
      opacity: 0.9;
      margin-bottom: 28px;
      font-size: 1.1rem;
    }
    input, textarea {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      font-family: 'ClashGrotesk', sans-serif;
    }
    .submit-btn {
      background: linear-gradient(135deg, var(--accent), #ff5252);
      color: white;
      border: none;
      padding: 16px;
      width: 100%;
      border-radius: 18px;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 6px 16px rgba(255, 107, 107, 0.3);
    }
    a {
      display: inline-block;
      margin-top: 24px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    footer {
      text-align: center;
      padding: 30px 0;
      opacity: 0.8;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
      margin: 0 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div class="logo">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6e8efb" />
              <stop offset="100%" stop-color="#a777e3" />
            </linearGradient>
          </defs>
          <path d="M16 6 C22 6 26 10 26 16 C26 22 22 26 16 26 C10 26 6 22 6 16 C6 12 8 8 12 6" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
          <path d="M20 22 L24 18 L20 14" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        YearnaZ
      </div>
      <div class="controls">
        <select id="langSelect">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="nl">Nederlands</option>
          <option value="ru">Русский</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
          <option value="ar">العربية</option>
        </select>
        <button id="themeBtn">🌙</button>
      </div>
    </nav>

    <main>
      <div class="form-box">
        <h1 id="title">Report a Lost Item</h1>
        <p id="subtitle">We’ll help you find it. Fill out the details below.</p>
        <form id="reportForm">
          <input type="text" id="item_name" placeholder="Item name" required>
          <input type="text" id="location" placeholder="Location" required>
          <textarea id="description" placeholder="Description" rows="4" required></textarea>
          <button type="submit" class="submit-btn" id="submitBtn">Submit Report</button>
        </form>
        <a href="index.html" id="backLink">← Back to Home</a>
      </div>
    </main>

    <footer>
      <p>© 2025 YearnaZ. Kindness, powered by community.</p>
      <p>
        <a href="about.html">About</a> • 
        <a href="privacy.html">Privacy</a> • 
        <a href="contact.html">Contact</a> • 
        <a href="hero-wall.html">Hero Wall</a>
      </p>
    </footer>
  </div>

  <!-- CRISP CHAT -->
  <script type="text/javascript">
    window.$crisp = []; window.CRISP_WEBSITE_ID = "YOUR_CRISP_ID";
    (function() { d = document; s = d.createElement("script");
    s.src = "https://client.crisp.chat/l.js"; s.async = 1;
    d.getElementsByTagName("head")[0].appendChild(s); })();
  </script>

  <script type="module">
    const themeBtn = document.getElementById('themeBtn');
    const isDark = localStorage.getItem('theme') === 'dark';
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });

    const translations = {
      en: { title: "Report a Lost Item", subtitle: "We’ll help you find it. Fill out the details below.", item: "Item name", location: "Location", desc: "Description", submit: "Submit Report", back: "← Back to Home" },
      es: { title: "Reportar un Artículo Perdido", subtitle: "Te ayudaremos a encontrarlo. Completa los detalles a continuación.", item: "Nombre del artículo", location: "Ubicación", desc: "Descripción", submit: "Enviar Reporte", back: "← Volver al Inicio" },
      fr: { title: "Signaler un objet perdu", subtitle: "Nous vous aiderons à le retrouver. Remplissez les détails ci-dessous.", item: "Nom de l'objet", location: "Emplacement", desc: "Description", submit: "Soumettre le rapport", back: "← Retour à l'accueil" },
      de: { title: "Verlorenen Gegenstand melden", subtitle: "Wir helfen Ihnen, ihn zu finden. Füllen Sie die Details unten aus.", item: "Gegenstandsname", location: "Standort", desc: "Beschreibung", submit: "Bericht senden", back: "← Zurück zur Startseite" },
      pt: { title: "Relatar um Item Perdido", subtitle: "Ajudaremos você a encontrá-lo. Preencha os detalhes abaixo.", item: "Nome do item", location: "Localização", desc: "Descrição", submit: "Enviar Relatório", back: "← Voltar para Início" },
      it: { title: "Segnala un oggetto smarrito", subtitle: "Ti aiuteremo a trovarlo. Compila i dettagli qui sotto.", item: "Nome oggetto", location: "Posizione", desc: "Descrizione", submit: "Invia Segnalazione", back: "← Torna alla Home" },
      nl: { title: "Meld een verloren voorwerp", subtitle: "We helpen je het te vinden. Vul hieronder de gegevens in.", item: "Naam voorwerp", location: "Locatie", desc: "Beschrijving", submit: "Rapport verzenden", back: "← Terug naar home" },
      ru: { title: "Сообщить о потере вещи", subtitle: "Мы поможем вам найти её. Заполните данные ниже.", item: "Название предмета", location: "Местоположение", desc: "Описание", submit: "Отправить отчет", back: "← Вернуться на главную" },
      ja: { title: "紛失物を報告", subtitle: "見つけるお手伝いをします。以下の詳細を入力してください。", item: "アイテム名", location: "場所", desc: "説明", submit: "報告を送信", back: "← ホームに戻る" },
      ko: { title: "분실물 신고", subtitle: "찾는 것을 도와드리겠습니다. 아래에 세부 정보를 입력하세요.", item: "물품 이름", location: "위치", desc: "설명", submit: "신고 제출", back: "← 홈으로 돌아가기" },
      zh: { title: "报告丢失物品", subtitle: "我们将帮您找回。请填写以下详细信息。", item: "物品名称", location: "位置", desc: "描述", submit: "提交报告", back: "← 返回首页" },
      ar: { title: "الإبلاغ عن عنصر مفقود", subtitle: "سنساعدك في العثور عليه. املأ التفاصيل أدناه.", item: "اسم العنصر", location: "الموقع", desc: "الوصف", submit: "إرسال التقرير", back: "← العودة إلى الصفحة الرئيسية" }
    };

    function applyLang(lang) {
      const t = translations[lang] || translations.en;
      document.getElementById('title').textContent = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('item_name').placeholder = t.item;
      document.getElementById('location').placeholder = t.location;
      document.getElementById('description').placeholder = t.desc;
      document.getElementById('submitBtn').textContent = t.submit;
      document.getElementById('backLink').textContent = t.back;
      localStorage.setItem('lang', lang);
    }

    const savedLang = localStorage.getItem('lang') || navigator.language.split('-')[0] || 'en';
    const lang = translations[savedLang] ? savedLang : 'en';
    applyLang(lang);
    document.getElementById('langSelect').value = lang;
    document.getElementById('langSelect').addEventListener('change', e => applyLang(e.target.value));

    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await supabase.from('reports').insert([{
        type: 'lost',
        item_name: document.getElementById('item_name').value,
        location: document.getElementById('location').value,
        description: document.getElementById('description').value
      }]);
      alert(error ? '❌ ' + error.message : '✅ Report submitted!');
    });
  </script>
</body>
</html>
